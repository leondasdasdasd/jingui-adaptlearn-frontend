<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/yungu-adaptive-mark.svg" />
    <title>云谷课堂 2.0 - 自适应学习系统</title>
    <meta name="description" content="基于云谷课堂2.0设计语言的自适应数学学习与智能评测系统，包含学生主页、课前小测、个性化练习、学习进度与做题记录。" />
    <meta property="og:title" content="云谷课堂 2.0 - 自适应学习系统" />
    <meta property="og:description" content="基于云谷课堂2.0设计语言的自适应数学学习与智能评测系统，包含学生主页、课前小测、个性化练习、学习进度与做题记录。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div id="app-bootstrap-state" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #334155; padding: 1.5rem; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <strong style="font-size: 0.9375rem; font-weight: 600; color: #1e293b;">正在加载云谷自适应学习系统</strong>
        <span style="margin-top: 0.35rem; font-size: 0.8125rem; color: #64748b;">Loading YunGu Adaptive Learning</span>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script id="app-bootstrap-guard">
      (function () {
        var hasReportedFailure = false;

        function showBootstrapFailure(error) {
          var bootstrapState = document.getElementById('app-bootstrap-state');
          if (!bootstrapState || hasReportedFailure) return;
          hasReportedFailure = true;
          console.error('App bootstrap failed:', error);
          bootstrapState.innerHTML = '<div role="alert" style="width:min(100%,28rem);background:#fff;border:1px solid #e2e8f0;border-radius:0.5rem;padding:2rem;box-shadow:0 10px 25px -5px rgba(15,23,42,0.08);"><strong style="display:block;font-size:1.125rem;color:#0f172a;">页面未能启动</strong><span style="display:block;margin-top:0.3rem;font-size:0.875rem;font-weight:600;color:#475569;">The app could not start</span><p style="margin:1rem 0 1.25rem;font-size:0.875rem;color:#64748b;line-height:1.65;">脚本加载或初始化失败。请刷新重试；如仍失败，请检查启动终端中的首条错误。<br>Reload the page. If it still fails, check the first error in the startup terminal.</p><button type="button" onclick="window.location.reload()" style="min-height:2.5rem;padding:0.5rem 1.25rem;border:0;border-radius:0.375rem;background:#0445fc;color:#fff;font-size:0.875rem;font-weight:600;cursor:pointer;">刷新页面 / Reload</button></div>';
        }

        window.addEventListener('error', function (event) {
          var isScriptTag = Boolean(
            event.target &&
            event.target.nodeType === 1 &&
            event.target.tagName &&
            event.target.tagName.toUpperCase() === 'SCRIPT'
          );
          var hasErrorMessage = Boolean(event.message || event.error);

          if (!isScriptTag && !hasErrorMessage) {
            return;
          }

          var msg = (event.message || (event.error && event.error.message) || '') + '';
          if (/websocket|ws:\/\/|wss:\/\//i.test(msg)) {
            return;
          }
          showBootstrapFailure(event.error || event.message || 'Resource loading failed');
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason || '';
          var reasonMsg = (typeof reason === 'string' ? reason : (reason && reason.message) || '') + '';
          if (/websocket|ws:\/\/|wss:\/\//i.test(reasonMsg)) {
            return;
          }
          showBootstrapFailure(event.reason || 'App initialization failed');
        });
        window.setTimeout(function () {
          showBootstrapFailure('App initialization timed out');
        }, 30000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
