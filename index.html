<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/yungu-adaptive-mark.svg" />
    <title>云谷课堂 2.0 - 自适应学习系统</title>
    <meta name="description" content="基于云谷课堂2.0设计语言的自适应数学学习与智能评测系统，包含学生主页、课前小测、个性化练习、学习进度与做题记录。" />
    <meta property="og:title" content="云谷课堂 2.0 - 自适应学习系统" />
    <meta property="og:description" content="基于云谷课堂2.0设计语言的自适应数学学习与智能评测系统，包含学生主页、课前小测、个性化练习、学习进度与做题记录。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #334155; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 15px; font-weight: 500; color: #1e293b;">正在加载云谷自适应学习系统…</div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (e) {
        console.error('App load error:', e);
        var root = document.getElementById('root');
        if (root && root.querySelector && root.querySelector('@keyframes') !== null) {
          // If still showing fallback loader, show error retry
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;padding:24px;"><div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;max-width:440px;text-align:center;box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);"><div style="font-size:32px;margin-bottom:12px;">⚠️</div><h3 style="font-size:18px;font-weight:600;color:#0f172a;margin:0 0 8px;">加载遇到问题</h3><p style="font-size:14px;color:#64748b;margin:0 0 20px;line-height:1.6;">页面初始化遇到了网络或脚本异常，请尝试重新加载。</p><button onclick="window.location.hash=\'#/adaptive-learning/teacher/textbook-lessons\';window.location.reload();" style="padding:9px 22px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:14px;font-weight:500;cursor:pointer;">重新加载页面</button></div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
